<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="36" height="36">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h2>Estaca El Tigre</h2>
      <p class="subtitle">Sistema de Control de Asistencia</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div *ngIf="errorMensaje" class="alert-error">
        {{ errorMensaje }}
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          email 
          placeholder="usuario@estaca.org"
          #emailInput="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="••••••••"
          #passwordInput="ngModel"
        />
      </div>

      <button type="submit" [disabled]="!loginForm.valid || cargando" class="btn-submit">
        <span *ngIf="!cargando">Iniciar Sesión</span>
        <span *ngIf="cargando">Verificando...</span>
      </button>
    </form>
  </div>
</div>
